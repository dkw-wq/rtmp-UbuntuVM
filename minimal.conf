# SRS 5.0 minimal configuration
# RTMP + HLS + HTTP-FLV + HTTP API + HTTP Callbacks

listen              1935;
max_connections     1000;
daemon              off;

# Log to file
srs_log_tank        file;
srs_log_file        ./objs/srs.log;
srs_log_level       trace;

# HTTP API (for management / monitoring)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP server (serves HLS / FLV / TS)
http_server {
    enabled         on;
    listen          8082;
    dir             /dev/shm/hls;
    crossdomain     on;
}

vhost __defaultVhost__ {
    # HLS — 4-second segments, 60-second window, stored on tmpfs.
    # Keep publisher keyframe interval <= hls_fragment for stable browser playback.
    hls {
        enabled         on;
        hls_path        /dev/shm/hls;
        hls_fragment    4;
        hls_window      60;
    }

    # Remux RTMP → HTTP-FLV / HTTP-TS
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }

    # HTTP Callbacks — only publish/unpublish (play/stop/dvr not needed for MVP)
    http_hooks {
        enabled         on;
        on_publish      http://localhost:9090/api/callback/publish;
        on_unpublish    http://localhost:9090/api/callback/unpublish;
    }
}
